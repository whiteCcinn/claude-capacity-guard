name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
          bash "$RUNNER_TEMP/claude-install.sh" 2.1.325
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate manifests
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/capacity-guard --strict
      - name: Test quota policy and lifecycle
        run: claude plugin test plugins/capacity-guard
